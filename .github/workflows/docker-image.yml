name: Docker CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Docker Login
      run: docker login -u ${{ secrets.DOCKERHUB_USER }} -p ${{ secrets.DOCKERHUB_PASS }}

    - name: Build Image
      run: docker build -t jjes07/randomquotes:latest .

    - name: Push Image
      run: docker push jjes07/randomquotes:latest

    # DEPLOY AUTOMÁTICO EN LA MÁQUINA VIRTUAL DE GCP
    - name: Deploy to GCP VM
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VM_IP }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          docker pull jjes07/randomquotes:latest
          docker stop randomquotes || true
          docker rm randomquotes || true
          docker run -d -p 80:80 --name randomquotes jjes07/randomquotes:latest